name: Release

# A pushed tag vX.Y.Z publishes to TestPyPI; publishing a GitHub Release for that tag
# publishes the same build to PyPI. Both use PyPI trusted publishing (OIDC), so no API
# token is stored in the repository. Each index needs a pending publisher registered for
# this repository, this workflow file and the matching environment name.

# No workflow-level concurrency block: inside the called testing.yml, github.workflow names
# this caller, so its group would equal ours and the run would wait on itself.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/testing.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Check the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/torchalg/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/torchalg/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
