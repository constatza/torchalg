source_roots = ["src"]

# Implements docs/dependency-architecture.md. These are desired boundaries;
# never add an edge merely to bless a current violation.

# Pure leaves and immutable records.
[[modules]]
path = "torchalg.utils.device"
depends_on = []
[[modules]]
path = "torchalg.utils.energy"
depends_on = []
[[modules]]
path = "torchalg.utils.grad_mode"
depends_on = []
[[modules]]
path = "torchalg.utils.numerics"
depends_on = []
[[modules]]
path = "torchalg.utils.validation"
depends_on = []
[[modules]]
path = "torchalg.analysis"
depends_on = []
[[modules]]
path = "torchalg.models.config"
depends_on = []
[[modules]]
path = "torchalg.models.context"
depends_on = []
[[modules]]
path = "torchalg.models.diagnostics"
depends_on = []
[[modules]]
path = "torchalg.models.history"
depends_on = []
[[modules]]
path = "torchalg.models.result"
depends_on = ["torchalg.models.diagnostics"]
[[modules]]
path = "torchalg.models.state"
depends_on = ["torchalg.models.history"]
[[modules]]
path = "torchalg.models.protocols"
depends_on = ["torchalg.models.history", "torchalg.models.result"]

# Monitoring and solver policies.
[[modules]]
path = "torchalg.monitoring"
depends_on = ["torchalg.utils.energy", "torchalg.utils.numerics"]
[[modules]]
path = "torchalg.strategies"
depends_on = ["torchalg.models.state", "torchalg.utils.energy", "torchalg.utils.numerics"]

# Stable preconditioner abstractions.
[[modules]]
path = "torchalg.preconditioners.base"
depends_on = []
[[modules]]
path = "torchalg.preconditioners.ports"
depends_on = []

# AMG foundation and high-risk feature seams.
[[modules]]
path = "torchalg.preconditioners.implementations.amg._graph"
depends_on = []
[[modules]]
path = "torchalg.preconditioners.implementations.amg._least_squares"
depends_on = []
[[modules]]
path = "torchalg.preconditioners.implementations.amg._algebraic_distance"
depends_on = ["torchalg.preconditioners.implementations.amg._graph", "torchalg.preconditioners.implementations.amg._least_squares"]
[[modules]]
path = "torchalg.preconditioners.implementations.amg._compatible_relaxation"
depends_on = ["torchalg.preconditioners.implementations.amg._graph"]
[[modules]]
path = "torchalg.preconditioners.implementations.amg.hierarchy"
depends_on = []
[[modules]]
path = "torchalg.preconditioners.implementations.amg._spectral"
depends_on = []
[[modules]]
path = "torchalg.preconditioners.implementations.amg._relaxation"
depends_on = []
[[modules]]
path = "torchalg.preconditioners.implementations.amg._jacobi_omega"
depends_on = ["torchalg.preconditioners.implementations.amg._spectral"]
[[modules]]
path = "torchalg.preconditioners.implementations.amg.transfer"
depends_on = []
[[modules]]
path = "torchalg.preconditioners.implementations.amg.cycle"
depends_on = ["torchalg.preconditioners.implementations.amg.hierarchy"]
[[modules]]
path = "torchalg.preconditioners.implementations.amg.smoothers"
depends_on = ["torchalg.preconditioners.implementations.amg._jacobi_omega", "torchalg.preconditioners.implementations.amg._relaxation"]
[[modules]]
path = "torchalg.preconditioners.implementations.amg._test_vectors"
depends_on = ["torchalg.preconditioners.implementations.amg.smoothers"]
[[modules]]
path = "torchalg.preconditioners.implementations.amg.amg"
depends_on = ["torchalg.preconditioners.base", "torchalg.preconditioners.implementations.amg.hierarchy"]
[[modules]]
path = "torchalg.preconditioners.implementations.amg"
depends_on = ["torchalg.preconditioners.implementations.amg._algebraic_distance", "torchalg.preconditioners.implementations.amg._compatible_relaxation", "torchalg.preconditioners.implementations.amg._jacobi_omega", "torchalg.preconditioners.implementations.amg._least_squares", "torchalg.preconditioners.implementations.amg._relaxation", "torchalg.preconditioners.implementations.amg._spectral", "torchalg.preconditioners.implementations.amg.amg", "torchalg.preconditioners.implementations.amg.cycle", "torchalg.preconditioners.implementations.amg.hierarchy", "torchalg.preconditioners.implementations.amg.smoothers", "torchalg.preconditioners.implementations.amg.transfer"]

# POD is an AMG client; AMG may never depend on POD.
[[modules]]
path = "torchalg.preconditioners.implementations.pod.basis"
depends_on = []
[[modules]]
path = "torchalg.preconditioners.implementations.pod.coarsening"
depends_on = ["torchalg.preconditioners.implementations.amg.transfer", "torchalg.preconditioners.implementations.pod.basis"]
[[modules]]
path = "torchalg.preconditioners.implementations.pod.weighting"
depends_on = ["torchalg.preconditioners.implementations.amg._test_vectors", "torchalg.utils.energy"]
[[modules]]
path = "torchalg.preconditioners.implementations.pod.variants"
depends_on = ["torchalg.preconditioners.implementations.amg.amg", "torchalg.preconditioners.implementations.amg.cycle", "torchalg.preconditioners.implementations.amg.smoothers", "torchalg.preconditioners.implementations.pod.coarsening"]
[[modules]]
path = "torchalg.preconditioners.implementations.pod"
depends_on = ["torchalg.preconditioners.implementations.pod.basis", "torchalg.preconditioners.implementations.pod.coarsening", "torchalg.preconditioners.implementations.pod.variants", "torchalg.preconditioners.implementations.pod.weighting"]

# Remaining concrete implementations share one bounded domain. Fine-grained
# AMG/POD rules above override this umbrella where dependency direction matters.
[[modules]]
path = "torchalg.preconditioners.implementations"
depends_on = ["torchalg.preconditioners.base", "torchalg.preconditioners.ports", "torchalg.preconditioners.implementations.amg", "torchalg.preconditioners.implementations.pod"]

# Solver orchestration depends on abstractions; factories alone compose concretes.
[[modules]]
path = "torchalg.base"
depends_on = ["torchalg.models.protocols", "torchalg.models.result", "torchalg.models.state", "torchalg.monitoring", "torchalg.preconditioners.base", "torchalg.strategies", "torchalg.utils.device", "torchalg.utils.grad_mode", "torchalg.utils.validation"]
[[modules]]
path = "torchalg.conjugate_gradient"
depends_on = ["torchalg.base", "torchalg.models.diagnostics", "torchalg.models.result", "torchalg.models.state", "torchalg.monitoring", "torchalg.preconditioners.base", "torchalg.strategies", "torchalg.utils.numerics", "torchalg.utils.validation"]
[[modules]]
path = "torchalg.factories"
depends_on = ["torchalg.base", "torchalg.conjugate_gradient", "torchalg.models.result", "torchalg.monitoring", "torchalg.preconditioners.base", "torchalg.preconditioners.implementations", "torchalg.strategies"]

# Comparison data and presentation remain independent of execution.
[[modules]]
path = "torchalg.comparison.models"
depends_on = []
[[modules]]
path = "torchalg.comparison.presentation"
depends_on = ["torchalg.comparison.models"]
[[modules]]
path = "torchalg.comparison.recommendations"
depends_on = ["torchalg.comparison.models"]
[[modules]]
path = "torchalg.comparison.runner"
depends_on = ["torchalg.comparison.models", "torchalg.factories", "torchalg.preconditioners.base"]
