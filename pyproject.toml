[project]
name = "torchalg"
version = "0.1.0"
description = "Pure PyTorch reimplementation of neuralls' iterative solvers and preconditioners"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["torch>=2.8.0,<3.0"]

[dependency-groups]
dev = [
    "pyamg>=5.3.0",
    "pytest>=9.0",
    "ruff>=0.13.1",
    "scipy>=1.16.2",
    "tach>=0.29.0",
    "ty>=0.0.22",
]
benchmark = ["matplotlib>=3.10.0"]
# Backend selectors (see [tool.uv] conflicts). `cuda` exists only as the second member of
# the conflict pair: plain `uv sync` already installs PyPI's CUDA torch.
cuda = ["torch>=2.8.0,<3.0"]
rocm = ["torch>=2.8.0,<3.0", "triton-rocm; sys_platform == 'linux'"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "benchmarks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["UP", "D"]
# RUF022: __all__ lists here are deliberately grouped by semantic category
# with comments (state/history/results/..., presets/core/protocols/...), not
# alphabetized - the rule's auto-sort would scramble that grouping.
ignore = ["RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"benchmarks/**/*.py" = ["D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["src/torchalg", "tests", "benchmarks"]
respect-ignore-files = true

[tool.ty.rules]
# Every concrete preconditioner (AMG/IC0/ICholesky/ILU/Jacobi/...) deliberately
# names its domain method `apply(residual, context)`, matching the
# Preconditioner protocol - which collides with nn.Module.apply(fn), a
# different method these classes also inherit for buffer/device propagation.
# This is a known, accepted naming collision (see e.g. JacobiPreconditioner's
# docstring), not something to rename across the whole hierarchy.
invalid-method-override = "ignore"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
no-matching-overload = "warn"

[tool.ty.environment]
root = ["src", ".", "benchmarks"]
python-version = "3.14"
python-platform = "all"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = ["-m", "not benchmark"]
markers = [
    "slow: tests that take >5 seconds (deselect with '-m \"not slow\"')",
    "benchmark: numerical algorithm benchmarks and exactness tests; performance suites under benchmarks/ (run with -m benchmark)",
    "integration: integration tests that test full workflows",
]

[tool.uv]
package = true
# `cuda` and `rocm` select the torch build for this repository's own environment only;
# dependency groups are never published, so consumers see the plain `torch` requirement.
conflicts = [[{ group = "cuda" }, { group = "rocm" }]]

[tool.uv.sources]
# PyPI torch on Linux is already the CUDA build, so only ROCm needs routing. Its Triton
# runtime must come from the same index (PyPI only carries an old `triton-rocm` pre-release).
torch = [{ index = "pytorch-rocm", group = "rocm", marker = "sys_platform == 'linux'" }]
triton-rocm = [{ index = "pytorch-rocm", group = "rocm", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.workspace]
members = [
    "benchmarks/tmp/rocm71",
]

[build-system]
requires = ["uv_build>=0.10", "uv_build<0.15"]
build-backend = "uv_build"
