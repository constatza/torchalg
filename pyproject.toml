[project]
name = "torchalg"
version = "0.1.0"
description = "Pure PyTorch reimplementation of neuralls' iterative solvers and preconditioners"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["torch>=2.8.0,<3.0"]

[dependency-groups]
dev = [
    "pyamg>=5.3.0",
    "pytest>=9.0",
    "ruff>=0.13.1",
    "scipy>=1.16.2",
    "tach>=0.29.0",
    "ty>=0.0.22",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["UP", "D"]
# RUF022: __all__ lists here are deliberately grouped by semantic category
# with comments (state/history/results/..., presets/core/protocols/...), not
# alphabetized - the rule's auto-sort would scramble that grouping.
ignore = ["RUF022"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["src/torchalg", "tests"]
respect-ignore-files = true

[tool.ty.rules]
# Every concrete preconditioner (AMG/IC0/ICholesky/ILU/Jacobi/...) deliberately
# names its domain method `apply(residual, context)`, matching the
# Preconditioner protocol - which collides with nn.Module.apply(fn), a
# different method these classes also inherit for buffer/device propagation.
# This is a known, accepted naming collision (see e.g. JacobiPreconditioner's
# docstring), not something to rename across the whole hierarchy.
invalid-method-override = "ignore"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
no-matching-overload = "warn"

[tool.ty.environment]
root = ["src", "."]
python-version = "3.14"
python-platform = "all"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-m", "not benchmark"]
markers = [
    "slow: tests that take >5 seconds (deselect with '-m \"not slow\"')",
    "benchmark: numerical algorithm benchmarks and exactness tests",
    "integration: integration tests that test full workflows",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["uv_build>=0.10", "uv_build<0.15"]
build-backend = "uv_build"
