[project]
name = "torchalg"
version = "0.1.0"
description = "Pure PyTorch reimplementation of neuralls' iterative solvers and preconditioners"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["torch>=2.8.0,<2.10.0"]

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.13.1", "scipy>=1.16.2", "tach>=0.29.0", "ty>=0.0.22"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["UP", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["src/torchalg", "tests"]
respect-ignore-files = true

[tool.ty.environment]
root = ["src", "."]
python-version = "3.14"
python-platform = "all"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-m", "not benchmark"]
markers = [
    "slow: tests that take >5 seconds (deselect with '-m \"not slow\"')",
    "benchmark: numerical algorithm benchmarks and exactness tests",
    "integration: integration tests that test full workflows",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.10", "uv_build<0.15"]
build-backend = "uv_build"
